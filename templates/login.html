{% extends "base.html" %}
{% block title %}Log in | TaskFlow{% endblock %}
{% block content %}
<div class="auth-wrap">
  <div class="auth-card">
    <h1>Welcome back</h1>
    <p class="sub">Log in to see your tasks.</p>

    <p class="error" id="error"></p>

    <form id="auth-form" data-mode="login">
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" required>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" required>
      </div>
      <button type="submit" class="btn btn-primary btn-block">Log in</button>
    </form>

    <p class="divider">or</p>
    <button type="button" id="google-btn" class="btn btn-google btn-block">Continue with Google</button>

    <p class="auth-switch">New here? <a href="/signup">Create an account</a></p>
  </div>
</div>
{% endblock %}
{% block scripts %}
<script type="module" src="{{ url_for('static', filename='auth.js') }}"></script>
{% endblock %}
