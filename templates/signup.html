{% extends "base.html" %}
{% block title %}Sign up | TaskFlow{% endblock %}
{% block content %}
<div class="auth-wrap">
  <div class="auth-card">
    <h1>Create your account</h1>
    <p class="sub">Free forever. Start organizing in seconds.</p>

    <p class="error" id="error"></p>

    <form id="auth-form" data-mode="signup">
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" required>
      </div>
      <div class="field">
        <label for="password">Password (at least 6 characters)</label>
        <input type="password" id="password" minlength="6" required>
      </div>
      <button type="submit" class="btn btn-primary btn-block">Sign up</button>
    </form>

    <p class="divider">or</p>
    <button type="button" id="google-btn" class="btn btn-google btn-block">Continue with Google</button>

    <p class="auth-switch">Already have an account? <a href="/login">Log in</a></p>
  </div>
</div>
{% endblock %}
{% block scripts %}
<script type="module" src="{{ url_for('static', filename='auth.js') }}"></script>
{% endblock %}
